[doc_verification]
# Workspace crates exempt from mandatory architectural headings during documentation migration
allowlist = [
    "crates/diagnostics",
    "egui_plot",
    "apps/xtask",
    "math_explorer",
    "math_explorer_gui",
]

[entropy_guard]
scan_paths = [
    "crates",
    "apps",
    "math_explorer",
    "math_explorer_gui",
    "egui_plot",
    ".github",
    "scripts",
    "Cargo.toml",
    "traceability.toml",
    "verification_whitelist.toml",
]
target_extensions = ["rs", "toml", "yml", "yaml", "json", "sh"]
allowlist = [
    "crates/unified_verification/src/entropy_guard/tests.rs",
]

[[workflow_linter.exceptions]]
workflow = ".github/workflows/ci.yml"
job = "publish-release"
allow_write = ["contents", "attestations", "id-token"]
reason = "Publishing GitHub Releases and SLSA provenance attestations on version tags requires contents: write, attestations: write, and id-token: write"

[[workflow_linter.exceptions]]
workflow = ".github/workflows/ci.yml"
job = "deploy-pages"
allow_write = ["pages", "id-token", "attestations"]
reason = "Deploying to GitHub Pages with SLSA provenance attestations requires pages: write, id-token: write, and attestations: write"


