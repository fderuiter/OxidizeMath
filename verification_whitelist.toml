[doc_verification]
# Only vendored third-party crates are exempt from mandatory architectural headings
allowlist = [
    "egui_plot",
]

[doc_verification.approved_ignore_fences]
# Binary-only math_explorer_gui crate::, out-of-line tab mod, and egui widget snippets that cannot link into library doctests
"docs/architecture/interactive_tool_walkthrough.md" = 6
"math_explorer_gui/README.md" = 3

[entropy_guard]
scan_paths = [
    "crates",
    "apps",
    "math_explorer",
    "math_explorer_gui",
    "egui_plot",
    ".github",
    ".githooks",
    "scripts",
    ".env",
    "Dockerfile",
    "Cargo.toml",
    "traceability.toml",
    "verification_whitelist.toml",
]
target_extensions = ["rs", "toml", "yml", "yaml", "json", "sh", "js", "html"]
allowlist = [
    "crates/unified_verification/src/entropy_guard/tests.rs",
    "crates/unified_verification/api_baseline.json",
]

[[workflow_linter.exceptions]]
workflow = ".github/workflows/ci.yml"
job = "publish-release"
allow_write = ["contents"]
reason = "Publishing GitHub Releases on version tags requires contents: write"

[[workflow_linter.exceptions]]
workflow = ".github/workflows/ci.yml"
job = "deploy-pages"
allow_write = ["pages", "id-token"]
reason = "Deploying to GitHub Pages requires pages: write and id-token: write"

[verify_suite]
min_verified_assertion_density = 0.40
min_total_production_density = 0.0160
min_verified_production_density = 0.0490
coverage_tolerance_pct = 1.5
unverified_modules = [
    "apps/xtask",
    "crates/02_engines/engine_linalg",
    "crates/diagnostics",
    "crates/engine_diffeq",
    "crates/engine_pde",
    "crates/federated_registry",
    "crates/markdown_tests",
    "crates/math_commons",
    "crates/oxidize_core",
    "crates/scientific_metadata",
    "crates/unified_verification",
    "crates/verified_engine",
    "crates/verified_engine_macros",
    "math_explorer",
    "math_explorer_gui",
]

