[package]
name = "pure_math"
version = "0.4.0"
edition = "2024"

[dependencies]
rustfft = { workspace = true }
nalgebra = { workspace = true }
quadrature = { workspace = true }
rand = { workspace = true }
statrs = { workspace = true }
petgraph = { workspace = true }
rand_distr = { workspace = true }
