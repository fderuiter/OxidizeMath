[package]
name = "verified_engine"
version = "0.1.0"
edition = "2024"

[features]
default = ["std"]
std = ["dep:scientific_metadata", "serde/std"]

[dependencies]
scientific_metadata = { path = "../scientific_metadata", optional = true }
serde = { workspace = true, default-features = false, features = ["derive"] }
verified_engine_macros = { version = "0.1.0", path = "../verified_engine_macros" }
[dev-dependencies]
approx = { workspace = true }

[lints]
workspace = true
