[package]
name = "verified_engine"
version = "0.1.0"
edition = "2024"

[package.metadata.oxidize]
tier = "00_foundation"
release_role = "internal"
facade_role = "none"
traceability = false

[features]
default = ["std"]
std = ["dep:scientific_metadata", "dep:serde", "serde/std"]

[dependencies]
scientific_metadata = { path = "../scientific_metadata", optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
verified_engine_macros = { version = "0.1.0", path = "../verified_engine_macros" }
[dev-dependencies]
approx = { workspace = true }

[[test]]
name = "allocator_trap"
required-features = ["std"]

[[test]]
name = "macro_integration"
required-features = ["std"]

[lints]
workspace = true
