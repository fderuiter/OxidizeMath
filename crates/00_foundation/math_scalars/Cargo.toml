[package]
name = "math_scalars"
version.workspace = true
edition = "2024"
description = "Canonical Tier 0 #![no_std] mathematical scalars, Cayley-Dickson algebras, Montgomery finite fields, Galois extensions, and p-adic rings"
license = "MIT OR Apache-2.0"

[features]
default = []
alloc = ["dep:dashu"]
std = ["alloc", "dashu/std"]

[dependencies]
dashu = { workspace = true, optional = true }
libm = { workspace = true }

[dev-dependencies]
verified_engine = { path = "../../verified_engine" }

[lints]
workspace = true
