[package]
name = "math_scalars"
version.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Tier 0 #![no_std] scalar contracts, fixed/arbitrary precision numbers, Cayley-Dickson algebras, Montgomery finite fields, Galois extensions, and p-adic lifting"

[features]
default = []
alloc = ["dep:dashu"]
serde = ["dep:serde", "dashu?/serde", "math_diagnostics/serde"]
std = ["alloc", "dashu?/std", "math_diagnostics/std", "serde?/std"]

[dependencies]
dashu = { workspace = true, optional = true }
libm = { workspace = true }
math_diagnostics = { path = "../math_diagnostics", default-features = false }
serde = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true, default-features = false, features = ["alloc", "float_roundtrip"] }
verified_engine = { path = "../../verified_engine" }

[lints]
workspace = true
