[package]
name = "math_scalars"
version.workspace = true
edition = "2024"
description = "Zero-allocation #![no_std] forward-mode automatic differentiation, IEEE-754 directed-rounding intervals, and midpoint-radius ball scalars"
license = "MIT OR Apache-2.0"

[features]
default = []
alloc = []
serde = ["dep:serde"]
std = ["alloc", "serde?/std"]

[dependencies]
libm = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true, default-features = false, features = ["alloc", "float_roundtrip"] }
verified_engine = { path = "../../verified_engine" }

[lints]
workspace = true
