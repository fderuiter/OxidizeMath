[package]
name = "math_rng"
version.workspace = true
edition = "2024"
description = "Zero-allocation Tier 0 no_std ChaCha8 PRNG streams, generic IEEE-754 samplers, and 64D static-table QMC views."

[package.metadata.oxidize]
tier = "00_foundation"
release_role = "release"
facade_role = "none"
traceability = true

[features]
default = []
alloc = ["math_scalars/alloc"]
serde = ["dep:serde", "math_scalars/serde", "rand_chacha/serde1"]
std = ["alloc", "math_scalars/std", "serde?/std"]

[dependencies]
math_scalars = { path = "../math_scalars", default-features = false }
rand_chacha = { workspace = true, default-features = false }
rand_core = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true, default-features = false, features = ["alloc", "float_roundtrip"] }
verified_engine = { path = "../verified_engine" }

[lints]
workspace = true
