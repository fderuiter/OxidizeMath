[package]
name = "engine_pde"
version.workspace = true
edition = "2024"

[features]
default = []
alloc = []
serde = ["dep:serde", "math_commons/serde"]
std = ["alloc", "math_commons/std", "serde?/std", "verified_engine/std"]

[dependencies]
math_commons = { path = "../math_commons", default-features = false }
rand_core = { workspace = true }
serde = { workspace = true, optional = true }
verified_engine = { version = "0.1.0", path = "../verified_engine", default-features = false }

[dev-dependencies]
oxidize_core = { path = "../oxidize_core" }
serde_json = { workspace = true, default-features = false, features = ["alloc", "float_roundtrip"] }

[[test]]
name = "pde_and_spde_verification"
required-features = ["std"]

[lints]
workspace = true
