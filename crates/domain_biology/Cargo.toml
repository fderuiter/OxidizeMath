[package]
name = "domain_biology"
version.workspace = true
edition = "2024"

[dependencies]
nalgebra = { workspace = true }
num-complex = { workspace = true }
rand = { workspace = true }
rustfft = { workspace = true }
thiserror = { workspace = true }
oxidize_core = { path = "../oxidize_core" }
verified_engine = { version = "0.1.0", path = "../verified_engine" }

math_commons = { path = "../math_commons" }
engine_pde = { path = "../engine_pde" }
diagnostics = { path = "../diagnostics" }
scientific_metadata = { path = "../scientific_metadata" }
pure_math = { path = "../pure_math" }
domain_applied = { path = "../domain_applied" }
serde = { workspace = true, features = ["derive"], optional = true }

[features]
default = []
serde = [
    "dep:serde",
    "oxidize_core/serde",
    "verified_engine/serde",
    "math_commons/serde",
    "engine_pde/serde",
    "diagnostics/serde",
    "scientific_metadata/serde",
    "pure_math/serde",
    "domain_applied/serde",
    "nalgebra/serde-serialize",
]

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
