[package]
name = "oxidize_core"
version = "0.1.0"
edition = "2024"

[features]
default = []
ast-analysis = ["dep:futures", "dep:proc-macro2", "dep:syn", "dep:toml"]

[[bin]]
name = "traceability_cli"
path = "src/bin/traceability_cli.rs"
required-features = ["ast-analysis"]

[dependencies]
futures = { workspace = true, optional = true }
math_rng = { path = "../00_foundation/math_rng", features = ["alloc", "serde"] }
proc-macro2 = { workspace = true, optional = true }
rand = { workspace = true, features = ["std", "alloc"] }
scientific_metadata = { path = "../scientific_metadata" }
serde = { workspace = true, features = ["derive"] }
syn = { workspace = true, features = ["full", "visit"], optional = true }
toml = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["Window", "Document", "HtmlElement", "Blob", "Url", "BlobPropertyBag", "Response"] }
wasm-bindgen-futures = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
