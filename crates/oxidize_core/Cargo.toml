[package]
name = "oxidize_core"
version = "0.1.0"
edition = "2024"

[features]
default = ["std"]
std = [
    "rand/std",
    "rand/alloc",
    "rand_chacha/std",
    "dep:serde",
    "dep:getrandom",
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:web-sys",
    "dep:wasm-bindgen-futures",
]
ast-analysis = ["std", "dep:futures", "dep:proc-macro2", "dep:quote", "dep:syn", "dep:toml"]

[[bin]]
name = "traceability_cli"
path = "src/bin/traceability_cli.rs"
required-features = ["ast-analysis"]

[dependencies]
futures = { workspace = true, optional = true }
libm = { workspace = true }
proc-macro2 = { workspace = true, optional = true }
quote = { workspace = true, optional = true }
rand = { version = "0.8.6", default-features = false }
rand_chacha = { version = "0.3.1", default-features = false }
serde = { workspace = true, features = ["derive"], optional = true }
syn = { workspace = true, features = ["full", "visit"], optional = true }
toml = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, features = ["Window", "Document", "HtmlElement", "Blob", "Url", "BlobPropertyBag", "Response"], optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
