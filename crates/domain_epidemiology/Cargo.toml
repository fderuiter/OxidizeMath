[package]
name = "domain_epidemiology"
version = "0.4.0"
edition = "2024"

[dependencies]
nalgebra = { workspace = true }
rand = { workspace = true }
oxidize_core = { path = "../oxidize_core" }
verified_engine = { version = "0.1.0", path = "../verified_engine" }

math_commons = { path = "../math_commons" }
diagnostics = { path = "../diagnostics" }
pure_math = { path = "../pure_math" }
serde = { workspace = true, features = ["derive"], optional = true }

[features]
default = []
serde = [
    "dep:serde",
    "oxidize_core/serde",
    "verified_engine/serde",
    "math_commons/serde",
    "diagnostics/serde",
    "pure_math/serde",
    "nalgebra/serde-serialize",
]

[lints]
workspace = true
