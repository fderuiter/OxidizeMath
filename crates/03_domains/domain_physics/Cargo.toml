[package]
name = "domain_physics"
version.workspace = true
edition = "2024"

[package.metadata.oxidize]
tier = "03_domains"
release_role = "release"
facade_role = "domain"
facade_module = "physics"
traceability = true
math_contract = true

[dependencies]
math_memory = { path = "../../00_foundation/math_memory", features = ["std"] }
rustfft = { workspace = true }
nalgebra = { workspace = true }
rand = { workspace = true }
num-complex = { workspace = true }
serde = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
oxidize_core = { path = "../../01_core/oxidize_core" }
verified_engine = { version = "0.1.0", path = "../../00_foundation/verified_engine" }

math_commons = { path = "../../02_engines/math_commons" }
engine_diffeq = { path = "../../02_engines/engine_diffeq", features = ["std"] }
engine_linalg = { path = "../../02_engines/engine_linalg" }
engine_opt = { path = "../../02_engines/engine_opt" }
engine_pde = { path = "../../02_engines/engine_pde", features = ["std"] }
rand_core = { workspace = true }
scientific_metadata = { path = "../../00_foundation/scientific_metadata" }
math_diagnostics = { path = "../../00_foundation/math_diagnostics" }
pure_math = { path = "../pure_math" }
domain_applied = { path = "../domain_applied" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]

[target.'cfg(target_arch = "wasm32")'.dependencies]

[dev-dependencies]
approx = { workspace = true }
diagnostics = { path = "../../01_core/diagnostics" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
