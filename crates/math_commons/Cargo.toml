[package]
name = "math_commons"
version.workspace = true
edition = "2024"

[features]
default = ["std"]
serde = [
    "dep:serde",
    "serde/alloc",
    "engine_linalg/serde",
    "math_diagnostics/serde",
    "math_rng/serde",
    "math_scalars/serde",
    "num-complex/serde",
]
std = [
    "dep:scientific_metadata",
    "math_diagnostics/std",
    "math_rng/std",
    "math_scalars/std",
    "num-complex/std",
    "num-traits/std",
    "serde?/std",
    "thiserror/std",
    "verified_engine/std",
]

[dependencies]
engine_linalg = { path = "../02_engines/engine_linalg" }
libm = { workspace = true }
math_diagnostics = { path = "../00_foundation/math_diagnostics", default-features = false }
math_rng = { path = "../00_foundation/math_rng", features = ["alloc"] }
math_scalars = { path = "../00_foundation/math_scalars", features = ["alloc"] }
num-complex = { workspace = true, default-features = false, features = ["libm"] }
num-traits = { workspace = true, default-features = false, features = ["libm"] }
rand_core = { workspace = true }
scientific_metadata = { path = "../scientific_metadata", optional = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true, default-features = false }
verified_engine = { version = "0.1.0", path = "../verified_engine", default-features = false }

[dev-dependencies]
diagnostics = { path = "../diagnostics" }
serde_json = { workspace = true, default-features = false, features = ["alloc", "float_roundtrip"] }

[[test]]
name = "test_bounded_primitives_errors"
required-features = ["std"]

[[test]]
name = "verified_ast_eval"
required-features = ["std"]

[[test]]
name = "verified_curve_solvers"
required-features = ["std"]

[[test]]
name = "verified_stochastic_kernel"
required-features = ["std"]





[target.'cfg(not(target_arch = "wasm32"))'.dependencies]

[target.'cfg(target_arch = "wasm32")'.dependencies]

[lints]
workspace = true
