[package]
name = "math_commons"
version.workspace = true
edition = "2024"

[features]
default = ["std"]
std = [
    "dep:diagnostics",
    "num-complex/std",
    "num-traits/std",
    "serde?/std",
    "thiserror/std",
    "verified_engine/std",
]
serde = [
    "dep:serde",
    "verified_engine/serde",
    "diagnostics?/serde",
    "num-complex/serde",
]

[dependencies]
diagnostics = { path = "../diagnostics", optional = true }
engine_linalg = { path = "../02_engines/engine_linalg" }
libm = { workspace = true }
num-complex = { workspace = true, default-features = false, features = ["libm"] }
num-traits = { workspace = true, default-features = false, features = ["libm"] }
rand_core = { workspace = true }
serde = { workspace = true, default-features = false, features = ["alloc", "derive"], optional = true }
thiserror = { workspace = true, default-features = false }
verified_engine = { version = "0.1.0", path = "../verified_engine", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]

[target.'cfg(target_arch = "wasm32")'.dependencies]

[dev-dependencies]
oxidize_core = { path = "../oxidize_core" }
serde_json = { workspace = true }

[lints]
workspace = true
