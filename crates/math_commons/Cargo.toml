[package]
name = "math_commons"
version.workspace = true
edition = "2024"

[features]
default = ["std"]
std = ["dep:diagnostics", "dep:num-complex", "dep:thiserror", "verified_engine/std"]

[dependencies]
diagnostics = { path = "../diagnostics", optional = true }
libm = { workspace = true }
num-complex = { workspace = true, optional = true }
rand_core = { workspace = true }
thiserror = { workspace = true, optional = true }
verified_engine = { version = "0.1.0", path = "../verified_engine", default-features = false }

[dev-dependencies]
oxidize_core = { path = "../oxidize_core" }





[target.'cfg(not(target_arch = "wasm32"))'.dependencies]

[target.'cfg(target_arch = "wasm32")'.dependencies]

[lints]
workspace = true
