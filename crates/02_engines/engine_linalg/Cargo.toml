[package]
name = "engine_linalg"
version.workspace = true
edition = "2024"
description = "Zero-allocation #![no_std] dense and sparse numerical linear algebra engine"
license = "MIT OR Apache-2.0"

[features]
default = []
alloc = ["math_scalars/alloc"]
serde = ["dep:serde", "math_diagnostics/serde", "math_scalars/serde"]
std = ["math_scalars/std"]

[dependencies]
math_diagnostics = { path = "../../00_foundation/math_diagnostics", default-features = false }
math_scalars = { path = "../../00_foundation/math_scalars", default-features = false }
serde = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true, default-features = false, features = ["alloc", "float_roundtrip"] }
verified_engine = { path = "../../verified_engine" }

[lints]
workspace = true
