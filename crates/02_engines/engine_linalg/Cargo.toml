[package]
name = "engine_linalg"
version.workspace = true
edition = "2024"
description = "Zero-allocation #![no_std] dense and sparse numerical linear algebra engine"
license = "MIT OR Apache-2.0"

[features]
default = []
alloc = []
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true, default-features = false, features = ["alloc", "float_roundtrip"] }
verified_engine = { path = "../../verified_engine" }

[lints]
workspace = true
