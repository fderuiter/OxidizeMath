[package]
name = "engine_linalg"
version.workspace = true
edition = "2024"
description = "Zero-allocation #![no_std] dense and sparse numerical linear algebra engine"
license = "MIT OR Apache-2.0"

[package.metadata.oxidize]
tier = "02_engines"
release_role = "release"
facade_role = "engine"
traceability = true
math_contract = true

[features]
default = []
alloc = ["math_memory/alloc", "math_scalars/alloc"]
nalgebra = ["alloc", "dep:nalgebra", "nalgebra/alloc"]
serde = [
    "dep:serde",
    "math_memory/serde",
    "math_scalars/serde",
    "nalgebra?/serde-serialize-no-std",
]
std = [
    "alloc",
    "math_memory/std",
    "math_scalars/std",
    "nalgebra?/std",
    "serde?/std",
]

[dependencies]
bytemuck = { workspace = true }
math_memory = { path = "../../00_foundation/math_memory", default-features = false }
math_scalars = { path = "../../00_foundation/math_scalars", default-features = false }
nalgebra = { workspace = true, default-features = false, features = ["alloc", "libm"], optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true, default-features = false, features = ["alloc", "float_roundtrip"] }
verified_engine = { path = "../../00_foundation/verified_engine" }

[lints]
workspace = true
