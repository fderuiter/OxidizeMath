[package]
name = "engine_linalg"
version.workspace = true
edition = "2024"
description = "Zero-allocation #![no_std] dense and sparse numerical linear algebra engine"
license = "MIT OR Apache-2.0"

[package.metadata.oxidize]
tier = "02_engines"
release_role = "release"
facade_role = "engine"
traceability = true
math_contract = true

[features]
default = []
alloc = []
serde = ["dep:serde", "math_diagnostics/serde"]

[dependencies]
math_diagnostics = { path = "../../00_foundation/math_diagnostics", default-features = false }
serde = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true, default-features = false, features = ["alloc", "float_roundtrip"] }
verified_engine = { path = "../../00_foundation/verified_engine" }

[lints]
workspace = true
