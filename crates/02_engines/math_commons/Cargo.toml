[package]
name = "math_commons"
version.workspace = true
edition = "2024"

[package.metadata.oxidize]
tier = "02_engines"
release_role = "release"
facade_role = "engine"
traceability = true
math_contract = true

[features]
default = ["std"]
alloc = ["math_memory/alloc", "math_rng/alloc", "math_scalars/alloc", "serde?/alloc"]
serde = [
    "dep:serde",
    "math_diagnostics/serde",
    "math_memory/serde",
    "math_rng/serde",
    "math_scalars/serde",
    "num-complex/serde",
]
std = [
    "alloc",
    "math_diagnostics/std",
    "math_memory/std",
    "math_rng/std",
    "math_scalars/std",
    "num-complex/std",
    "num-traits/std",
    "serde?/std",
    "thiserror/std",
    "verified_engine/std",
]

[dependencies]
bytemuck = { workspace = true }
libm = { workspace = true }
math_diagnostics = { path = "../../00_foundation/math_diagnostics", default-features = false }
math_memory = { path = "../../00_foundation/math_memory", default-features = false }
math_rng = { path = "../../00_foundation/math_rng", default-features = false }
math_scalars = { path = "../../00_foundation/math_scalars", default-features = false }
num-complex = { workspace = true, default-features = false, features = ["libm", "bytemuck"] }
num-traits = { workspace = true, default-features = false, features = ["libm"] }
rand_core = { workspace = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true, default-features = false }
verified_engine = { version = "0.1.0", path = "../../00_foundation/verified_engine", default-features = false }

[dev-dependencies]
diagnostics = { path = "../../01_core/diagnostics" }
oxidize_core = { path = "../../01_core/oxidize_core" }
serde_json = { workspace = true, default-features = false, features = ["alloc", "float_roundtrip"] }

[[test]]
name = "interval_enclosure"
required-features = ["std"]

[[test]]
name = "test_bounded_primitives_errors"
required-features = ["std"]

[[test]]
name = "verified_ast_eval"
required-features = ["std"]

[[test]]
name = "verified_curve_solvers"
required-features = ["std"]

[[test]]
name = "verified_stochastic_kernel"
required-features = ["std"]

[lints]
workspace = true
