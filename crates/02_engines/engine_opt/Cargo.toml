[package]
name = "engine_opt"
version.workspace = true
edition = "2024"
description = "Zero-allocation #![no_std] polynomial and damped Levenberg-Marquardt curve-fitting engine"
license = "MIT OR Apache-2.0"

[package.metadata.oxidize]
tier = "02_engines"
release_role = "release"
facade_role = "engine"
traceability = true
math_contract = true

[features]
default = ["std"]
alloc = ["engine_linalg/alloc", "math_scalars/alloc"]
serde = [
    "alloc",
    "dep:serde",
    "serde/alloc",
    "engine_linalg/serde",
    "math_diagnostics/serde",
    "math_scalars/serde",
]
std = [
    "alloc",
    "dep:scientific_metadata",
    "math_diagnostics/std",
    "math_scalars/std",
    "serde?/std",
    "thiserror/std",
    "verified_engine/std",
]

[dependencies]
engine_linalg = { path = "../engine_linalg", default-features = false }
math_diagnostics = { path = "../../00_foundation/math_diagnostics", default-features = false }
math_scalars = { path = "../../00_foundation/math_scalars", default-features = false }
scientific_metadata = { path = "../../00_foundation/scientific_metadata", optional = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true, default-features = false }
verified_engine = { version = "0.1.0", path = "../../00_foundation/verified_engine", default-features = false }

[dev-dependencies]
serde_json = { workspace = true, default-features = false, features = ["alloc", "float_roundtrip"] }

[[test]]
name = "verified_curve_solvers"
required-features = ["std"]

[lints]
workspace = true
