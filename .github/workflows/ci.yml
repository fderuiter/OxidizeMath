name: Rust CI

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  merge_group:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  pre-flight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-preflight-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-preflight-

      - name: Build Unified Verification Tool
        run: cargo build -p unified_verification --release

      - name: Lint CI Workflows
        run: cargo run -p unified_verification --release -- lint-workflows

      - name: Verify Architectural Records Updates
        run: cargo run -p unified_verification --release -- verify-records
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}

      - name: Check Traceability
        run: cargo run -p unified_verification --release -- traceability

      - name: Check Unused Dependencies
        uses: bnjbvr/cargo-machete@cf4ad43b2ea507679a5c66685b7225ca7510eafc # main

      - name: Clean up machete artifacts
        run: rm -rf cargo-machete*

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@c4abcb90a5fac18f5f8744cbf7bd11b00a37ca41 # v1.10.2

      - name: Install cargo-audit
        run: cargo binstall --no-confirm --version 0.23.0 cargo-audit

      - name: Security Audit
        run: cargo audit

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Check File Lengths (500 lines limit)
        run: cargo run -p unified_verification --release -- check-file-lengths

      - name: Check Policy Audit
        run: cargo run -p unified_verification --release -- test-policy-audit

      - name: Check Entropy and Secrets
        run: cargo run -p unified_verification --release -- check-entropy

      - name: Check Crate Documentation
        run: cargo run -p unified_verification --release -- check-docs

      - name: Check Workspace Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - name: Run Doc Tests
        run: cargo test --doc --workspace --all-features

      - name: Check Markdown Links
        run: cargo run -p xtask -- check-markdown-links

  build-and-test:
    name: Build and Test (${{ matrix.name }})
    needs: pre-flight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: Linux Native
            artifact_name: linux_artifact
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows Native
            artifact_name: windows_installer
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macOS Native
            artifact_name: macos_app
          - os: ubuntu-latest
            target: wasm32-unknown-unknown
            name: Web/WASM
            artifact_name: wasm_app

    steps:
      - name: Free Disk Space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.target }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: Build Unified Verification Tool
        run: cargo build -p unified_verification --release

      - name: Build (Native)
        if: matrix.target != 'wasm32-unknown-unknown'
        run: cargo build --workspace --verbose --all-features

      - name: Run Clippy (Native)
        if: matrix.target != 'wasm32-unknown-unknown'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check Workspace Benchmarks (Native)
        if: matrix.target != 'wasm32-unknown-unknown'
        run: cargo check --workspace --benches --all-features --verbose

      - name: Run Clippy Benchmarks (Native)
        if: matrix.target != 'wasm32-unknown-unknown'
        run: cargo clippy --workspace --benches --all-features -- -D warnings

      - name: Check Workspace Examples (Native)
        if: matrix.target != 'wasm32-unknown-unknown'
        run: cargo check --workspace --examples --all-features --verbose

      - name: Run Clippy Examples (Native)
        if: matrix.target != 'wasm32-unknown-unknown'
        run: cargo clippy --workspace --examples --all-features -- -D warnings

      - name: Install cargo-llvm-cov
        if: runner.os == 'Linux' && matrix.target != 'wasm32-unknown-unknown'
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-llvm-cov

      - name: Run Workspace Tests (Native)
        if: matrix.target != 'wasm32-unknown-unknown'
        run: cargo test --workspace --lib --tests

      - name: Run Integrity Verified Suite
        if: runner.os == 'Linux' && matrix.target != 'wasm32-unknown-unknown'
        run: cargo run -p unified_verification --release -- verify-suite
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}

      - name: Upload Verification Certificate
        if: runner.os == 'Linux' && matrix.target != 'wasm32-unknown-unknown'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-certificate-${{ matrix.artifact_name }}
          path: Verification_Certificate.json

      - name: Check Workspace (WASM)
        if: matrix.target == 'wasm32-unknown-unknown'
        run: cargo check --workspace --target wasm32-unknown-unknown --all-features --verbose

      - name: Check Workspace Tests (WASM)
        if: matrix.target == 'wasm32-unknown-unknown'
        run: cargo check --tests --workspace --target wasm32-unknown-unknown --all-features --verbose

      - name: Run Clippy (WASM)
        if: matrix.target == 'wasm32-unknown-unknown'
        run: cargo clippy --workspace --lib --bins --tests --target wasm32-unknown-unknown --all-features -- -D warnings

      - name: Install cargo-binstall
        if: matrix.target == 'wasm32-unknown-unknown'
        uses: cargo-bins/cargo-binstall@c4abcb90a5fac18f5f8744cbf7bd11b00a37ca41 # v1.10.2

      - name: Install WASM Tools and Compression Utilities
        if: matrix.target == 'wasm32-unknown-unknown'
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen brotli
          cargo binstall --no-confirm trunk

      - name: Build Web Application
        if: matrix.target == 'wasm32-unknown-unknown'
        working-directory: math_explorer_gui
        run: trunk build --release

      - name: Pre-compress Web Distribution Assets
        if: matrix.target == 'wasm32-unknown-unknown'
        run: bash scripts/compress_dist.sh math_explorer_gui/dist

      - name: Verify WebAssembly Size Budget
        if: matrix.target == 'wasm32-unknown-unknown'
        run: bash scripts/verify_wasm_budget.sh math_explorer_gui/dist

  compile-papers:
    name: Compile Academic Papers
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    needs: [pre-flight, build-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download Verification Certificate
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: verification-certificate-linux_artifact
          path: .

      - name: Install TeXLive
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra texlive-science texlive-binaries

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Compile Papers
        run: cargo run -p xtask -- compile-papers

      - name: Upload PDF Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compiled_papers
          path: papers/output/*.pdf
          retention-days: 7

      - name: Upload Papers Release Bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: papers-release-bundle
          path: |
            papers/output/papers-bundle.tar.gz
            papers/output/SHA256SUMS
            papers/output/SHA256SUMS-papers
          if-no-files-found: error

  feature-matrix:
    name: Domain Tests (${{ matrix.feature || 'core-only' }})
    needs: pre-flight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        feature:
          - pure_math
          - applied
          - ai
          - biology
          - climate
          - epidemiology
          - physics
          - '' # This tests --no-default-features

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache dependencies
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-features-${{ matrix.feature }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-features-${{ matrix.feature }}-

      - name: Run Tests
        run: |
          if [ -n "${{ matrix.feature }}" ]; then
            cargo run -p xtask -- test-features ${{ matrix.feature }}
          else
            cargo run -p xtask -- test-features core-only
          fi

  package:
    name: Package Installers (${{ matrix.os }})
    needs: pre-flight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{
            fromJSON(
              (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
              && '[{"os":"ubuntu-latest","target":"deb"},{"os":"macos-latest","target":"dmg"},{"os":"windows-latest","target":"wix"}]'
              || '[{"os":"ubuntu-latest","target":"deb"}]'
            )
          }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev build-essential

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@c4abcb90a5fac18f5f8744cbf7bd11b00a37ca41 # v1.10.2

      # Pinned cargo-packager version for reproducible packaging builds without source compilation fallback
      - name: Install cargo-packager
        env:
          CARGO_PACKAGER_VERSION: "0.11.8"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo binstall --no-confirm --disable-strategies compile cargo-packager@${{ env.CARGO_PACKAGER_VERSION }}

      - name: Build and Package
        shell: bash
        run: |
          cargo build --release -p math_explorer_gui
          cargo packager --release -p math_explorer_gui -f ${{ matrix.target }}

      - name: Generate SHA-256 Manifest
        shell: bash
        run: |
          if [ ! -d "math_explorer_gui/dist" ]; then
            echo "Error: math_explorer_gui/dist directory does not exist" >&2
            exit 1
          fi

          cd math_explorer_gui/dist

          if command -v sha256sum >/dev/null 2>&1; then
            SHACMD="sha256sum"
            SHACHECK="sha256sum -c"
          elif command -v shasum >/dev/null 2>&1; then
            SHACMD="shasum -a 256"
            SHACHECK="shasum -a 256 -c"
          else
            echo "Error: Neither sha256sum nor shasum is available" >&2
            exit 1
          fi

          shopt -s nullglob
          shopt -u dotglob
          files=()
          for f in *.deb *.dmg *.msi *.exe *.wix; do
            if [ -f "$f" ] && [ "$f" != "SHA256SUMS" ]; then
              files+=("$f")
            fi
          done

          if [ ${#files[@]} -eq 0 ]; then
            echo "Error: No build artifacts found in math_explorer_gui/dist" >&2
            exit 1
          fi

          for f in "${files[@]}"; do
            if [ ! -s "$f" ]; then
              echo "Error: Build artifact $f is empty" >&2
              exit 1
            fi
          done

          $SHACMD "${files[@]}" > SHA256SUMS
          $SHACHECK SHA256SUMS

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: math_explorer-${{ matrix.target }}
          path: |
            math_explorer_gui/dist/*.deb
            math_explorer_gui/dist/*.dmg
            math_explorer_gui/dist/*.msi
            math_explorer_gui/dist/*.exe
            math_explorer_gui/dist/*.wix
            math_explorer_gui/dist/SHA256SUMS
            !math_explorer_gui/dist/.*
            !math_explorer_gui/dist/.*/**
          if-no-files-found: error

  publish-release:
    name: Publish Release
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, package, compile-papers]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download workflow artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets

          # Copy Debian packages
          if [ -d artifacts/math_explorer-deb ]; then
            find artifacts/math_explorer-deb -type f -name "*.deb" -exec cp {} release-assets/ \;
          fi

          # Copy macOS disk images
          if [ -d artifacts/math_explorer-dmg ]; then
            find artifacts/math_explorer-dmg -type f -name "*.dmg" -exec cp {} release-assets/ \;
          fi

          # Copy Windows WiX installers (.msi or .exe)
          if [ -d artifacts/math_explorer-wix ]; then
            find artifacts/math_explorer-wix -type f \( -name "*.msi" -o -name "*.exe" \) -exec cp {} release-assets/ \;
          fi

          # Copy academic paper bundle
          if [ -f artifacts/papers-release-bundle/papers-bundle.tar.gz ]; then
            cp artifacts/papers-release-bundle/papers-bundle.tar.gz release-assets/
          fi

          # Copy fresh Verification_Certificate.json generated by build-and-test
          if [ -f artifacts/verification-certificate-linux_artifact/Verification_Certificate.json ]; then
            cp artifacts/verification-certificate-linux_artifact/Verification_Certificate.json release-assets/
          fi

          # Require every expected platform installer, paper bundle, and certificate
          shopt -s nullglob
          deb_files=(release-assets/*.deb)
          dmg_files=(release-assets/*.dmg)
          win_files=(release-assets/*.msi release-assets/*.exe)

          if [ ${#deb_files[@]} -eq 0 ]; then
            echo "Error: Missing expected Linux .deb installer in release-assets" >&2
            exit 1
          fi
          if [ ${#dmg_files[@]} -eq 0 ]; then
            echo "Error: Missing expected macOS .dmg installer in release-assets" >&2
            exit 1
          fi
          if [ ${#win_files[@]} -eq 0 ]; then
            echo "Error: Missing expected Windows .msi or .exe installer in release-assets" >&2
            exit 1
          fi
          if [ ! -s release-assets/papers-bundle.tar.gz ]; then
            echo "Error: Missing or empty papers-bundle.tar.gz in release-assets" >&2
            exit 1
          fi
          if [ ! -s release-assets/Verification_Certificate.json ]; then
            echo "Error: Missing or empty Verification_Certificate.json in release-assets" >&2
            exit 1
          fi

          # Attach component-specific checksum manifests to avoid filename collision
          if [ ! -s artifacts/papers-release-bundle/SHA256SUMS-papers ]; then
            echo "Error: Missing or empty SHA256SUMS-papers in artifacts/papers-release-bundle" >&2
            exit 1
          fi
          cp artifacts/papers-release-bundle/SHA256SUMS-papers release-assets/SHA256SUMS-papers
          if [ -f artifacts/math_explorer-deb/SHA256SUMS ]; then
            cp artifacts/math_explorer-deb/SHA256SUMS release-assets/SHA256SUMS-deb
          fi
          if [ -f artifacts/math_explorer-dmg/SHA256SUMS ]; then
            cp artifacts/math_explorer-dmg/SHA256SUMS release-assets/SHA256SUMS-dmg
          fi
          if [ -f artifacts/math_explorer-wix/SHA256SUMS ]; then
            cp artifacts/math_explorer-wix/SHA256SUMS release-assets/SHA256SUMS-wix
          fi

          # Generate consolidated SHA-256 checksum manifest over deliverables only (omitting SHA256SUMS*)
          cd release-assets

          if command -v sha256sum >/dev/null 2>&1; then
            SHACMD="sha256sum"
            SHACHECK="sha256sum -c"
          elif command -v shasum >/dev/null 2>&1; then
            SHACMD="shasum -a 256"
            SHACHECK="shasum -a 256 -c"
          else
            echo "Error: Neither sha256sum nor shasum is available" >&2
            exit 1
          fi

          files=()
          for f in *; do
            if [ -f "$f" ] && [[ "$f" != SHA256SUMS* ]]; then
              files+=("$f")
            fi
          done

          if [ ${#files[@]} -eq 0 ]; then
            echo "Error: No release assets found to publish" >&2
            exit 1
          fi

          for f in "${files[@]}"; do
            if [ ! -s "$f" ]; then
              echo "Error: Asset file $f is empty" >&2
              exit 1
            fi
          done

          $SHACMD -- "${files[@]}" > SHA256SUMS
          $SHACHECK -- SHA256SUMS
          $SHACHECK -- SHA256SUMS-papers

      - name: Attest release build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release-assets/SHA256SUMS

      - name: Attest release checksum manifests
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/SHA256SUMS*

      - name: Publish GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release-assets/* \
            --title "${{ github.ref_name }}" \
            --generate-notes

