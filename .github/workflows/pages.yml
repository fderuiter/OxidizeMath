name: Deploy to GitHub Pages

permissions: read-all

concurrency:
  group: pages
  cancel-in-progress: false

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Web Application and Academic Papers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install TeXLive and WASM Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra texlive-science texlive-binaries binaryen brotli

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@c4abcb90a5fac18f5f8744cbf7bd11b00a37ca41 # v1.10.2

      - name: Install Trunk
        run: cargo binstall --no-confirm trunk

      - name: Build Web Application
        working-directory: math_explorer_gui
        run: trunk build --release

      - name: Verify WebAssembly Size Budget
        run: bash scripts/verify_wasm_budget.sh math_explorer_gui/dist

      - name: Compile Academic Papers
        run: cargo run -p xtask -- compile-papers

      - name: Stage Academic Papers
        run: |
          mkdir -p math_explorer_gui/dist/papers
          cp -r papers/output/* math_explorer_gui/dist/papers/

      - name: Generate SHA-256 Manifest
        shell: bash
        run: |
          if [ ! -d "math_explorer_gui/dist" ]; then
            echo "Error: math_explorer_gui/dist directory does not exist" >&2
            exit 1
          fi

          cd math_explorer_gui/dist

          if command -v sha256sum >/dev/null 2>&1; then
            SHACMD="sha256sum"
            SHACHECK="sha256sum -c"
          elif command -v shasum >/dev/null 2>&1; then
            SHACMD="shasum -a 256"
            SHACHECK="shasum -a 256 -c"
          else
            echo "Error: Neither sha256sum nor shasum is available" >&2
            exit 1
          fi

          shopt -s nullglob
          files=()
          for f in *; do
            if [ -f "$f" ] && [ "$f" != "SHA256SUMS" ]; then
              files+=("$f")
            fi
          done

          if [ ${#files[@]} -eq 0 ]; then
            echo "Error: No build artifacts found in math_explorer_gui/dist" >&2
            exit 1
          fi

          for f in "${files[@]}"; do
            if [ ! -s "$f" ]; then
              echo "Error: Build artifact $f is empty" >&2
              exit 1
            fi
          done

          $SHACMD "${files[@]}" > SHA256SUMS
          $SHACHECK SHA256SUMS

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: math_explorer_gui/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
