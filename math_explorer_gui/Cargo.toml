[package]
name = "math_explorer_gui"
version = "0.4.0"
edition = "2021"
authors = ["Frederick de Ruiter <127706008+fderuiter@users.noreply.github.com>"]
description = "Interactive scientific simulation and mathematical visualization desktop and web GUI"
homepage = "https://github.com/fderuiter/OxidizeMath"
license = "AGPL-3.0-or-later"
build = "build.rs"

[package.metadata.packager]
product-name = "Math Explorer"
identifier = "com.jules.mathexplorer"
version = "0.4.0"
publisher = "OxidizeMath"
homepage = "https://github.com/fderuiter/OxidizeMath"
long-description = "Math Explorer provides an interactive desktop environment built on eframe and egui for exploring verified mathematical and scientific simulations across physics, biology, climate modeling, epidemiology, artificial intelligence, applied mathematics, and pure mathematics."
license-file = "../LICENSE"
copyright = "Copyright (c) 2024-2026 Frederick de Ruiter and OxidizeMath Contributors"
category = "Education"
before-packaging-command = "cargo build --release -p math_explorer_gui"
icons = ["icons/32x32.png", "icons/128x128.png", "icons/256x256.png", "icons/512x512.png", "icons/icon.icns", "icons/icon.ico"]
out-dir = "dist"
formats = ["wix", "dmg", "deb"]

[package.metadata.packager.deb]
section = "science"
files = { "../LICENSE" = "usr/share/doc/math-explorer/copyright" }
depends = [
    "libc6",
    "libgcc-s1",
    "libgl1",
    "libegl1",
    "libx11-6",
    "libx11-xcb1",
    "libxcb1",
    "libxcursor1",
    "libxi6",
    "libxrender1",
    "libxkbcommon0",
    "libxkbcommon-x11-0",
    "libwayland-client0",
    "libwayland-cursor0",
    "libwayland-egl1",
    "libdbus-1-3",
]

[features]
default = ["math_explorer", "ai", "applied", "biology", "climate", "epidemiology", "physics", "pure_math"]
pure_math = ["math_explorer/pure_math"]
applied = ["math_explorer/applied", "pure_math"]
ai = ["math_explorer/ai", "applied", "pure_math"]
biology = ["math_explorer/biology", "applied", "pure_math"]
climate = ["math_explorer/climate", "ai"]
epidemiology = ["math_explorer/epidemiology", "pure_math"]
physics = ["math_explorer/physics", "applied", "pure_math"]

[dependencies]
futures = { workspace = true }
federated_registry = { path = "../crates/federated_registry" }
eframe = { workspace = true }
egui_plot = "0.34.1"
nalgebra = { workspace = true }
oxidize_core = { path = "../crates/oxidize_core" }
math_explorer = { path = "../math_explorer", optional = true }
math_commons = { path = "../crates/math_commons" }
scientific_metadata = { path = "../crates/scientific_metadata" }
diagnostics = { path = "../crates/diagnostics" }
num-complex = { workspace = true }
rand = { workspace = true }
petgraph = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "AnalyserNode",
    "AudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "BaseAudioContext",
    "BiquadFilterNode",
    "BiquadFilterType",
    "CssStyleDeclaration",
    "Document",
    "DynamicsCompressorNode",
    "Element",
    "ErrorEvent",
    "Event",
    "EventInit",
    "GainNode",
    "History",
    "HtmlCanvasElement",
    "HtmlElement",
    "Location",
    "MediaQueryList",
    "Node",
    "NodeList",
    "OscillatorNode",
    "OscillatorType",
    "PeriodicWave",
    "PeriodicWaveOptions",
    "Response",
    "StereoPannerNode",
    "Storage",
    "Window",
] }

[target.wasm32-unknown-unknown.dependencies]
wasm-bindgen-futures = { workspace = true }

[dev-dependencies]
png = "0.18"
rustfft = { workspace = true }
verified_engine = { path = "../crates/verified_engine" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[build-dependencies]
futures = { workspace = true }
oxidize_core = { path = "../crates/oxidize_core" }
serde_json = { workspace = true }

[lints]
workspace = true
