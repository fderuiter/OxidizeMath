[package]
name = "math_explorer_gui"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[package.metadata.packager]
product-name = "Math Explorer"
identifier = "com.jules.mathexplorer"
version = "0.1.0"
icons = ["icons/32x32.png", "icons/128x128.png", "icons/256x256.png", "icons/512x512.png", "icons/icon.icns", "icons/icon.ico"]
out-dir = "dist"
formats = ["wix", "dmg", "deb"]

[features]
default = ["math_explorer", "ai", "applied", "biology", "climate", "epidemiology", "physics", "pure_math"]
pure_math = ["math_explorer/pure_math"]
applied = ["math_explorer/applied", "pure_math"]
ai = ["math_explorer/ai", "pure_math"]
biology = ["math_explorer/biology", "applied", "pure_math"]
climate = ["math_explorer/climate", "ai"]
epidemiology = ["math_explorer/epidemiology", "pure_math"]
physics = ["math_explorer/physics", "applied", "pure_math"]

[dependencies]
futures = { workspace = true }
federated_registry = { path = "../crates/federated_registry" }
eframe = { workspace = true }
egui_plot = "0.34.1"
rfd = { workspace = true }
nalgebra = { workspace = true }
oxidize_core = { path = "../crates/oxidize_core" }
math_explorer = { path = "../math_explorer", optional = true }
math_commons = { path = "../crates/math_commons" }
scientific_metadata = { path = "../crates/scientific_metadata" }
diagnostics = { path = "../crates/diagnostics" }
num-complex = { workspace = true }
rand = { workspace = true }
petgraph = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { workspace = true }
getrandom = { workspace = true, features = ["js"] }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["Window", "Document", "HtmlCanvasElement", "Element", "Node", "Worker", "MessageEvent", "DedicatedWorkerGlobalScope", "ErrorEvent"] }

[target.wasm32-unknown-unknown.dependencies]
wasm-bindgen-futures = { workspace = true }

[package.metadata.cargo-machete]

[lints]
workspace = true
