<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    .brand-badge { fill: #172554; stroke: #3b82f6; }
    .brand-axes { stroke: #60a5fa; stroke-opacity: 0.5; }
    .brand-wave { stroke: #ffffff; }
    .brand-node { fill: #38bdf8; }
    @media (prefers-color-scheme: light) {
      .brand-badge { fill: #eff6ff; stroke: #2563eb; }
      .brand-axes { stroke: #60a5fa; stroke-opacity: 0.65; }
      .brand-wave { stroke: #1d4ed8; }
      .brand-node { fill: #2563eb; }
    }
  </style>
  <rect class="brand-badge" x="4" y="4" width="56" height="56" rx="14" fill="#172554" stroke="#3b82f6" stroke-width="3"/>
  <line class="brand-axes" x1="14" y1="32" x2="50" y2="32" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5"/>
  <line class="brand-axes" x1="32" y1="14" x2="32" y2="50" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5"/>
  <path class="brand-wave" d="M 14 36 C 20 18, 26 18, 32 32 C 38 46, 44 46, 50 28" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="brand-node" cx="32" cy="32" r="4" fill="#38bdf8"/>
</svg>
