[target.wasm32-unknown-unknown]
runner = ["python3", "-B", "-u", "-c", 'import os, pathlib, runpy, sys; bases = [os.environ.get("CARGO_MANIFEST_DIR", ""), os.getcwd(), sys.argv[1] if len(sys.argv) > 1 else ""]; root = next((p for b in bases if b for p in [pathlib.Path(os.path.abspath(b)), *pathlib.Path(os.path.abspath(b)).parents] if (p / "scripts" / "wasm_test_runner.py").is_file()), None); sys.exit("Error: scripts/wasm_test_runner.py not found") if root is None else None; script = str(root / "scripts" / "wasm_test_runner.py"); sys.argv = [script, *sys.argv[1:]]; runpy.run_path(script, run_name="__main__")']
rustflags = ["-C", "target-feature=+bulk-memory", "-C", "strip=debuginfo"]
