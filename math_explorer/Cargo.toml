[package]
name = "math_explorer"
version = "0.4.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
math_commons = { path = "../crates/math_commons" }
diagnostics = { path = "../crates/diagnostics" }
pure_math = { path = "../crates/pure_math" }
domain_applied = { path = "../crates/domain_applied", optional = true }
domain_ai = { path = "../crates/domain_ai", optional = true }
domain_physics = { path = "../crates/domain_physics", optional = true }
domain_biology = { path = "../crates/domain_biology", optional = true }
domain_climate = { path = "../crates/domain_climate", optional = true }
domain_epidemiology = { path = "../crates/domain_epidemiology", optional = true }
nalgebra = { workspace = true }
oxidize_core = { path = "../crates/oxidize_core" }

[features]
default = []
pure_math = []
applied = ["pure_math", "dep:domain_applied"]
ai = ["pure_math", "dep:domain_ai"]
biology = ["applied", "pure_math", "dep:domain_biology"]
climate = ["ai", "dep:domain_climate"]
epidemiology = ["pure_math", "dep:domain_epidemiology"]
physics = ["applied", "pure_math", "dep:domain_physics"]

[dev-dependencies]
approx = { workspace = true }
num-complex = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }
verified_engine = { path = "../crates/verified_engine" }
criterion = { workspace = true }

[[bench]]
name = "sorting_benchmark"
harness = false
required-features = ["applied"]

