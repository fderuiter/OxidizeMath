[package]
name = "oxidize-cli"
version.workspace = true
edition = "2024"
license = "AGPL-3.0-or-later"

[package.metadata.oxidize]
tier = "apps"
release_role = "release"
facade_role = "none"
traceability = false

[[bin]]
name = "oxidize-cli"
path = "src/main.rs"
bench = false

[dependencies]
oxidizemath = { path = "../../crates/04_bindings/oxidizemath", default-features = false }

[features]
default = []
pure_math = ["oxidizemath/pure_math"]
applied = ["pure_math", "oxidizemath/applied"]
ai = ["applied", "pure_math", "oxidizemath/ai"]
biology = ["applied", "pure_math", "oxidizemath/biology"]
climate = ["ai", "pure_math", "oxidizemath/climate"]
epidemiology = ["pure_math", "oxidizemath/epidemiology"]
physics = ["applied", "pure_math", "oxidizemath/physics"]
serde = ["oxidizemath/serde"]

[[example]]
name = "bench_morphogenesis"
required-features = ["biology"]

