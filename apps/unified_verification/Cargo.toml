[package]
name = "unified_verification"
version = "0.1.0"
edition = "2024"

[package.metadata.oxidize]
tier = "apps"
release_role = "internal"
facade_role = "none"
traceability = false

[[bin]]
name = "unified_verification"
path = "src/main.rs"
bench = false

[dependencies]
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true }
regex = { workspace = true }
walkdir = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["full", "visit"] }
toml = { workspace = true }
serde-saphyr = { workspace = true }
proc-macro2 = { workspace = true, features = ["span-locations"] }
chrono = { workspace = true }
oxidize_core = { path = "../../crates/01_core/oxidize_core", features = ["ast-analysis"] }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
scientific_verification = { path = "../../crates/04_bindings/scientific_verification" }
ureq = { workspace = true, features = ["json"] }

[lints]
workspace = true
